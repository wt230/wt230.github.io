group_name: Wang Group
tagline: Water treatment and water chemistry
institution: Department of Civil Engineering, University of Manitoba

# The one-paragraph thesis. This is the first prose a prospective
# student reads, so it is written for them, not for a reviewer.
thesis: >-
  We work on a deceptively simple question: when you put ultraviolet
  light and an oxidant into water, what actually happens to the
  contaminants, and what do you create along the way? Answering it
  properly takes kinetics, analytical chemistry, reactor engineering,
  and an increasing amount of code. Our group builds the measurement
  methods and computational tools the field needs to get those
  answers right.

themes:
  - slug: hrsc
    title: Measuring what water does to radicals
    blurb: >-
      Every model of an advanced oxidation process depends on knowing
      how quickly a given water quenches hydroxyl radicals. The
      measurement is harder and less reproducible than the literature
      admits. We developed one of the standard methods, and we are
      running an inter-laboratory comparison across three groups to
      find out how well it travels between labs.
    detail: >-
      TODO - two or three sentences on current directions, and what a
      student joining this theme would actually do day to day.

  - slug: aop
    title: Predicting degradation before the reactor is built
    blurb: >-
      We maintain a kinetic database of hydroxyl radical rate
      constants assembled from six decades of radiation chemistry
      literature, and simulation tools that use it to predict
      micropollutant removal under realistic water conditions.
      Students here learn to write code.
    detail: >-
      TODO - confirm the compound count and describe the calculator
      before this goes public.

  - slug: dbp
    title: The byproducts nobody was looking for
    blurb: >-
      Oxidation removes one problem and can create another. We study
      what forms during and after treatment, and how operational
      choices — quenching agent, chlorine dose, process sequence —
      change the answer.
    detail: >-
      TODO

  - slug: monitoring
    title: Watching water in real time
    blurb: >-
      We are building water quality monitoring capability for the
      Upper Nelson River watershed, which means field deployment in
      genuinely difficult conditions and all the instrumentation and
      data problems that come with it.
