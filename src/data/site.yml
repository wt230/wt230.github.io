group_name: Wang Group
# Quoted because the value contains a colon — unquoted, YAML reads
# "Micropollutants" as a key and the build fails.
tagline: "Micropollutants: Treatment and Chemistry"
institution: Department of Civil Engineering, University of Manitoba

# The one-paragraph thesis. This is the first prose a prospective
# student reads, so it is written for them, not for a reviewer.
thesis: >-
  Micropollutants occur at concentrations hundreds or thousands of times
  lower than the bulk constituents of water. The cost of removing them
  does not scale down to match — in most cases it is far higher. How do
  we bring that cost down? Answering it properly takes kinetics,
  analytical chemistry, reactor engineering, and an increasing amount of
  computing. Our group builds the measurement methods, treatment
  technologies, and computational tools the field needs to get those
  answers right.

themes:
  - slug: hrsc
    title: Measuring what water does to radicals
    blurb: >-
      Every model of an advanced oxidation process depends on knowing how
      quickly a given water consumes hydroxyl radicals. Measuring that
      rate is slow, and the numbers do not always reproduce. We are
      optimizing a real-time instrument to overcome both problems, and
      using it to examine how hydroxyl radicals interact with natural
      organic matter.
    detail: >-
      TODO - what a student joining this theme would do day to day.

  - slug: aop
    title: Exploring what radicals do to micropollutants
    blurb: >-
      We apply both established and emerging treatment processes to
      generate strong oxidants such as hydroxyl radicals, and use them to
      break micropollutants apart. Simulation tools let us predict how far
      a compound degrades under realistic water conditions. Oxidation
      solves one problem and can create another, so we also study what
      forms during treatment and what remains afterward.
    detail: >-
      TODO

  - slug: monitoring
    title: Watching water in real time
    blurb: >-
      We are building instruments that measure water quality continuously
      and report it in real time. These are going into Manitoba waters —
      the Red River, the Upper Nelson River, and Lake Winnipeg — to map
      water quality at high resolution and identify pollutant hotspots.
    detail: >-
      TODO

  - slug: uv-photochem
    title: Chemistry before engineering
    blurb: >-
      We study how organic compounds absorb ultraviolet light and what
      becomes of them when they do, where a radical chooses to attack a
      given structure, and what the resulting fragments turn into. These
      are questions about mechanism rather than performance — and getting
      them right is what makes the engineering predictable rather than
      empirical.
    detail: >-
      TODO

