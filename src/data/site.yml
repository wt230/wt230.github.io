group_name: Wang Group
# Quoted because the value contains a colon — unquoted, YAML reads
# "Micropollutants" as a key and the build fails.
tagline: "Micropollutants: Treatment and Chemistry"
institution: Department of Civil Engineering, University of Manitoba

# The one-paragraph thesis. This is the first prose a prospective
# student reads, so it is written for them, not for a reviewer.
thesis: >-
  Micropollutants occur at concentrations hundreds or thousands of times
  lower than the bulk constituents of water. The cost of removing them
  does not scale down to match — in most cases it is far higher. How do
  we bring that cost down? Answering it properly takes kinetics,
  analytical chemistry, reactor engineering, and an increasing amount of
  computing. Our group builds the measurement methods, treatment
  technologies, and computational tools the field needs to get those
  answers right.

themes:
  - slug: hrsc
    title: Measuring what water does to radicals
    blurb: >-
      Every model of an advanced oxidation process depends on knowing how
      quickly a given water consumes hydroxyl radicals. Measuring that
      rate is slow, and the numbers do not always reproduce. We are
      optimizing a real-time instrument to overcome both problems, and
      using it to examine how hydroxyl radicals interact with natural
      organic matter.
    detail: >-
      TODO - what a student joining this theme would do day to day.

  - slug: aop
    title: Exploring what radicals do to micropollutants
    blurb: >-
      We apply both established and emerging treatment processes to
      generate strong oxidants such as hydroxyl radicals, and use them to
      break micropollutants apart. Simulation tools let us predict how far
      a compound degrades under realistic water conditions. Oxidation
      solves one problem and can create another, so we also study what
      forms during treatment and what remains afterward.
    detail: >-
      TODO

  - slug: monitoring
    title: Watching water in real time
    link: /projects/nelson-river
    link_label: Follow the Nelson River project
    blurb: >-
      We are building instruments that measure water quality continuously
      and report it in real time. These are going into Manitoba waters —
      the Red River, the Upper Nelson River, and Lake Winnipeg — to map
      water quality at high resolution and identify pollutant hotspots.
    detail: >-
      TODO

  - slug: uv-photochem
    title: Why reactions go where they go
    blurb: >-
      We study how organic compounds absorb ultraviolet light, where
      radicals attack a given structure, and what the fragments become.
      Knowing why a process works is what lets you predict when it won't.
    detail: >-
      TODO

# Shown on the Join page and the home page call to action.
# Set `open: false` when nothing is available — an honest empty state
# is better than a stale advertisement.
openings:
  open: true
  positions:
    - level: PhD or MSc
      topic: Micropollutant treatment and chemistry
      funded: true
      start: TODO - confirm current start dates
      # `detail` may be a single paragraph or a list of them.
      detail:
        - >-
          The students will be supported through research grants,
          scholarships, or a combination of the two. See the next section
          for how to apply.
        - We also welcome excellent MEng applicants.
    - level: Postdoctoral researcher
      detail: >-
        We welcome postdoctoral researchers who hold their own fellowship,
        and are glad to support applications to funding schemes. Write with
        the scheme you have in mind and we can discuss a project.
    - level: Undergraduate researcher
      # The background note above is placed before this entry: most
      # undergraduate applicants will not have it yet.
      entry_level: true
      detail: >-
        Undergraduate researchers in the group have been supported by NSERC
        Undergraduate Student Research Awards, the Mitacs Globalink
        Research Internship, and the University of Manitoba Undergraduate
        Research Awards. Each has its own deadlines
        and application process, so check the official procedures for the
        one you are interested in, then get in touch.
  background: >-
    A background in water treatment is the most useful preparation —
    water and wastewater treatment, water chemistry, environmental
    engineering, or chemical engineering with a water focus. Laboratory
    experience helps.
  # What a first email should contain. Specific asks filter for the
  # applicants who read the page.
  email_expectations:
    - Which of our research themes you want to work on, and why that one
    - A CV, including any laboratory experience
    - Transcripts, unofficial is fine at this stage

# Full-width photograph under the page title.
banner:
  photo: lcmsms-wide.jpg
  caption: >-
    The Vanquish Flex autosampler, pump and column compartment feeding the
    TSQ Quantis Plus mass spectrometer.

facilities:
  - name: Thermo Scientific TSQ Quantis Plus with Vanquish Flex LC
    short: Triple quadrupole LC-MS/MS
    detail: >-
      Acquired 2025 through the Canada Foundation for Innovation John
      R. Evans Leaders Fund. Trace-level quantification of
      micropollutants and transformation products, in our own lab
      rather than in a queue somewhere else.

  - name: UV light sources
    detail: >-
      Low-pressure and medium-pressure mercury lamps, an excimer source at
      222 nm, and Violumas LEDs at 260 and 310 nm — enough of the spectrum
      to separate what a wavelength does from what an oxidant does.

  - name: Collimated beam and flow-through systems
    detail: >-
      Bench-scale collimated beam apparatus and flow-through cuvette
      systems for controlled fluence experiments, with radiometers for
      fluence rate measurement.

  - name: UV-vis spectrometers
    photo: stellarnet.jpg
    photo_width: 70
    caption: >-
      The StellarNet spectrometer and its matched deuterium-halogen
      source.
    detail: >-
      A VWR V-1200 benchtop instrument, and a StellarNet portable
      spectrometer covering 190 to 850 nm for measurements in the field.

  - name: Micropollutant extraction system
    detail: >-
      Sample preparation and concentration for trace analysis, including
      PFAS.

  - name: Field monitoring instrumentation
    detail: >-
      A YSI EXO1S multi-parameter sonde as a reference instrument,
      alongside a prototype scavenging capacity meter developed in the
      group, for deployment in Manitoba waters.

  - name: Stainless steel UV reactors
    detail: >-
      Annular reactors at 20 cm and 50 cm diameter, for work at a scale
      where the fluence distribution stops being uniform.

facilities_note: >-
  This is not an exhaustive list; ask if you are looking for something in
  particular.

