  - name: Chunyang Chen
    role: PhD Student
    bio_short: >-
      Chunyang received her bachelor's degree in environmental science from
      Northeastern University in China, and her master's in environmental
      engineering from Tongji University. Her research is on micropollutant
      removal by advanced oxidation processes. Outside research she enjoys
      exploring cuisines and travelling.
    photo: /images/people/chunyang-chen.jpg

  - name: Fateme Mohamadi
    role: MSc Student
    bio_short: >-
      Fateme holds a BSc and an MSc in chemical engineering from Iran, with
      a focus on wastewater treatment. Her research applies hydroxyl radical
      scavenging capacity to surface water monitoring, with the aim of
      detecting changes in water quality quickly and over large areas.
      Outside research she reads, plays video games, and watches films,
      science fiction especially.
