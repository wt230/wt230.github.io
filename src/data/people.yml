pi:
  name: Chengjin Wang
  role: Assistant Professor, Ph.D., P.Eng.
  credentials: Ph.D., P.Eng.
  email: chengjin.wang@umanitoba.ca
  office: E1-449 EITC
  phone: 204-474-8381
  scholar: https://scholar.google.com/citations?user=sNRhGZEAAAAJ&hl=en
  photo: /images/people/chengjin-wang.jpg
  bio_short: >-
    Dr. Wang is an assistant professor in Environmental Engineering. He
    studied water and wastewater treatment at Tongji University in
    Shanghai, completed his PhD at the University of Alberta in 2016,
    and held postdoctoral positions at the University of Toronto and the
    Connecticut Agricultural Experiment Station before joining the
    University of Manitoba in December 2021. He serves on the Early
    Career Boards of Environmental Science & Technology (ACS
    Publications) and the Journal of Environmental Engineering (ASCE).

