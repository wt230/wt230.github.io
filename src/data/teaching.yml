# ---------------------------------------------------------------
# Teaching page. Add a year to a course's `years` as you teach it.
# `outcomes` is optional; where present it renders as a numbered list
# beneath the description.
# ---------------------------------------------------------------

intro: >-
  Teaching in Civil Engineering at the University of Manitoba since 2022,
  across environmental engineering analysis, solid waste management, and
  water treatment chemistry.

courses:
  - code: CIVL 3690
    title: Environmental Engineering Analysis
    level: Undergraduate
    years: 2022, 2023, 2024, 2025
    note: >-
      A four-credit course for third- and fourth-year students in Civil
      Engineering and the Environmental Engineering option. Environmental
      engineering is a multidisciplinary field with roots in chemistry,
      biology, civil engineering, public health, ecology, and ethics. The
      course introduces environmental engineering analysis, water quality
      parameters and guidelines, physical and chemical unit operations in
      water and wastewater treatment, and air pollution. The fundamentals
      learned here are used in later courses on the design of treatment
      systems.

  - code: CIVL 4130
    title: Solid Waste Management
    level: Undergraduate
    years: 2022, 2025
    note: >-
      Solid waste management is an essential component of modern civil
      infrastructure. The course introduces the principles and practice of
      integrated solid waste management in a civil and municipal context.
      Federal and provincial regulations are covered, with an emphasis on
      recycling, reuse and recovery for the safe and economic management of
      municipal solid waste. Waste characteristics, transportation,
      sorting, utilisation and final disposal are presented both as
      environmental protection and as resource recovery, alongside the
      economics and practicalities of alternative technologies. Special
      wastes — batteries, used oil, scrap tyres, and construction and
      demolition debris — are covered briefly, together with the principles
      of hazardous waste management and disposal.

  - code: CIVL 4500 T05
    title: Chemical Reactions in Water Treatment
    level: Undergraduate
    years: 2023
    new: true
    note: >-
      A four-credit course for third- and fourth-year students in Civil
      Engineering. Students learn the fundamental principles of aquatic
      chemistry: kinetics, acid-base equilibria, coordination chemistry,
      redox chemistry, photochemistry, radical chemistry, and chemistry at
      the water-solid and water-air interfaces. The aim is a better
      understanding of the chemical and photochemical processes in natural
      and engineered water systems — rivers, lakes, and treatment plants.
      Each topic is supplemented with case studies linking chemical
      principles to engineering practice. Designed for students
      specialising in pollution control, water treatment, and waste
      management.

  - code: CIVL 7200 T08
    title: Chemistry for Water Treatment and Analysis
    level: Graduate
    years: 2023
    new: true
    note: >-
      A three-credit course for graduate students in Civil Engineering.
      Students learn the fundamental principles of aquatic chemistry:
      kinetics, acid-base equilibria, coordination chemistry, redox
      chemistry, and chemistry at the water-solid and water-air interfaces.
      The aim is a better understanding of the chemical processes in
      natural and engineered water systems — rivers, lakes, and treatment
      plants. Students present their term projects to the class.

  - code: CIVL 7200 T09
    title: Photochemical Purification of Water and Air
    level: Graduate
    years: 2023, 2024
    new: true
    note: >-
      A three-credit course for graduate students in Civil Engineering.
      Students learn the fundamental principles and engineering
      applications of photochemical processes in water and air
      purification, covering basic photochemistry, UV light sources, UV
      dose quantification, disinfection of water and wastewater, chemical
      transformation by direct photolysis, photooxidation and
      photoreduction, and disinfection of air and surfaces.
    outcomes:
      - Understand key photochemical concepts and principles in
        environmental engineering.
      - Compare the advantages and disadvantages of each photochemical
        process.
      - Design photochemical processes for target pollutants and
        microorganisms.
      - Critically evaluate relevant photochemical processes and products.
