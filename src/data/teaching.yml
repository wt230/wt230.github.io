# ---------------------------------------------------------------
# Teaching page. Add a year to a course's `years` as you teach it.
# ---------------------------------------------------------------

intro: >-
  Teaching in Civil Engineering at the University of Manitoba since 2022,
  across environmental engineering analysis, solid waste management, and
  water treatment chemistry — three of these courses new to the department.

courses:
  - code: CIVL 3690
    title: Environmental Engineering Analysis
    level: Undergraduate
    years: 2022, 2023, 2024, 2025
    note: >-
      A core undergraduate course. Recent additions include a unit on air
      pollution, a field trip to the Morris water treatment plant, and
      self-check quizzes on UM Learn.

  - code: CIVL 4130
    title: Solid Waste Management
    level: Undergraduate
    years: 2022, 2025
    note: >-
      Guest speakers from industry and the regulator give students a view
      of how solid waste is managed in practice.

  - code: CIVL 4500 T05
    title: Chemical Reactions in Water Treatment
    level: Undergraduate
    years: 2023
    new: true

  - code: CIVL 7200 T08
    title: Chemistry for Water Treatment and Analysis
    level: Graduate
    years: 2023
    new: true
    note: Students present their term projects to the class.

  - code: CIVL 7200 T09
    title: Photochemical Purification of Water and Air
    level: Graduate
    years: 2023, 2024
    new: true

development:
  - >-
    Three courses in water treatment chemistry were built from scratch,
    none having previously existed in the department.
  - >-
    Contributed to the departmental design of a new course to replace
    CIVL 3690.
