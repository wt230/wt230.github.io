      prototype developed in the group

# What the project is trying to establish, in plain language.
aims:
  - Measure water quality continuously rather than sample by sample
  - Map the watershed at a resolution that reveals pollutant hotspots
  - Establish how well a low-cost prototype tracks a reference instrument
    under genuinely difficult field conditions

