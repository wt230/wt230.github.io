title: The Nelson River project
subtitle: Continuous water quality monitoring in the Upper Nelson River watershed

summary: >-
  Water quality in a large northern river changes faster than a sampling
  schedule can follow. Ice, distance and freshet all conspire against the
  grab sample, and a monthly bottle tells you very little about a
  contaminant that arrives over three days and is gone. This project is
  building instrumentation that measures continuously and reports in real
  time, so that the record reflects what the river actually did rather
  than what it happened to be doing on sampling day.

