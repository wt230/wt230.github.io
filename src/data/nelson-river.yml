title: The Nelson River project
subtitle: >-
  Development of a novel water quality monitoring tool and its application
  in the Upper Nelson River watershed

summary: >-
  This project develops a monitoring tool that responds in real time to
  both inorganic and organic species in water. Run from a boat, it
  produces a high-resolution profile along the river, revealing the
  pollution sources that degrade water quality and threaten fish habitat.

objectives_intro: The specific objectives of this project are as follows.

objectives:
  - >-
    To develop and optimize a novel water quality monitoring tool in the
    laboratory at the University of Manitoba.
  - >-
    To apply the optimized prototype to produce a high-resolution water
    quality map for the entire Upper Nelson River, and to identify
    potential pollution sources.
  - >-
    To collect water samples at those potential pollution sources for
    extensive laboratory analysis, and to develop remedial measures that
    protect fish habitat.

